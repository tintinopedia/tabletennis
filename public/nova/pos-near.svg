x="289" y="222" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffd23f">NOVA</text><rect x="78" y="64" width="236" height="66" rx="8" fill="#0b1220" fill-opacity=".82" stroke="#ffd23f" stroke-opacity=".5"/><text x="88" y="82" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#e8eef8">Robot sits on the table, right behind</text><text x="88" y="99" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#e8eef8">the net on its own half. Balls land short:</text><text x="88" y="116" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#e8eef8">pushes, flicks, over-the-table attacks.</text><path d="M309 189 L 367 189" stroke="#ffd23f" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ah)" opacity=".8"/><text x="70" y="368" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9fb0c8">Used by presets #37 to #44 · switch RH / LH mode in the Nova app to mirror the placements</text></svg>