<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d17">
<title>Tintinopedia · Offline</title>
<style>
  html,body{margin:0;height:100%;background:#080d17;color:#eef2f8;font-family:system-ui,-apple-system,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:120px;height:120px}
  h1{font-size:22px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em}
  p{color:#b7c0cf;max-width:320px;line-height:1.5;margin:0 0 20px}
  button{background:#f26a35;color:#fff;border:0;border-radius:999px;padding:12px 22px;font-size:15px;font-weight:600}
</style>
</head>
<body><main>
  <img src="/brand/logo.png" alt="">
  <h1>You're offline</h1>
  <p>Tintinopedia needs an internet connection to load your sessions. Check Wi-Fi or mobile data and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main></body>
</html>
